<main class="pokemon-detalhes">

  <!-- =========================
       BOTÃO VOLTAR
       ========================= -->

  <div class="botao-voltar-container">

    <button
      type="button"
      class="botao-voltar"
      aria-label="Voltar para a Pokédex"
      title="Voltar para a Pokédex"
      (click)="voltarParaPokedex()">

      ←

    </button>

  </div>


  <!-- =========================
       POKÉDEX
       ========================= -->

  @if (pokemonApi(); as pokemon) {

    <div class="container-fluid">

      <app-pokedex-device
        [pokemon]="pokemon"
        (previousPokemon)="pokemonAnterior()"
        (nextPokemon)="proximoPokemon()">
      </app-pokedex-device>

    </div>

  }


  <!-- =========================
       ERRO
       ========================= -->

  @else if (erroCarregamento()) {

    <div class="estado-detalhes">

      <h2>
        Ocorreu um erro
      </h2>

      <p>
        Não foi possível carregar este Pokémon.
      </p>

      <button
        type="button"
        class="btn btn-danger"
        (click)="carregarPokemon()">

        Tentar novamente

      </button>

    </div>

  }


  <!-- =========================
       PREPARANDO
       ========================= -->

  @else {

    <div class="estado-detalhes">

      <p>
        Preparando Pokémon...
      </p>

    </div>

  }

</main>
